spring.application.name=FishingPermit
server.port=${SERVER_PORT:8082}

# Optional local overrides (ignored in git)
spring.config.import=optional:file:application-local.properties

# Datasource Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fishing_permit_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:FishingPermitSuperSecretKey2026AdminOfficePortalAuthentication123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SQL Script Execution Configuration
# spring.sql.init.mode=always
# spring.jpa.defer-datasource-initialization=true
